name: Vérifier les MCP personnalisés

on:
  push:
    branches:
      - feature/mcp-personnalises-ui-20261023
    paths:
      - "api/main.py"
      - "api/connexions.py"
      - "connexions/mcp_personnalises.py"
      - "core/mcp_tools.py"
      - "core/registre_outils.py"
      - "migrations/2026_10_23_mcp_personnalises.sql"
      - "migrations/2026_10_23_mcp_personnalises_indexes.sql"
      - "test_mcp_plateformes.py"
      - "test_mcp_personnalises_smoke.py"
      - ".github/workflows/test-mcp-personnalises.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Syntaxe Python et tests MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dépendances nécessaires aux tests MCP
        run: python -m pip install --disable-pip-version-check "mcp>=1.0.0" "httpx>=0.27" "requests>=2.31" "fastapi>=0.110" "pydantic>=2.0"
      - name: Vérifier la syntaxe des modules touchés
        run: python -m compileall -q api/main.py api/connexions.py connexions/mcp_personnalises.py core/mcp_tools.py core/registre_outils.py test_mcp_plateformes.py
      - name: Tester le registre MCP et les confirmations obligatoires
        run: python -m unittest test_mcp_plateformes -v
      - name: Tester la configuration et la validation des serveurs personnalisés
        run: python -m unittest test_mcp_personnalises_smoke -v
