name: Video montage checks

on:
  push:
    branches:
      - wip/video-montage-non-verifie
    paths:
      - "api/chat.py"
      - "api/main.py"
      - "api/uploads.py"
      - "core/main.py"
      - "core/mcp_tools.py"
      - "core/registre_outils.py"
      - "core/serveur_mcp_video.py"
      - "core/video_workspaces.py"
      - "core/stockage_r2.py"
      - "requirements.txt"
      - "railpack.json"
      - "tests/test_video_workspaces.py"
      - "core/stockage_r2.py"
      - ".github/workflows/video-montage-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      R2_ENDPOINT: https://example.invalid
      R2_BUCKET_NAME: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install video MCP and test dependencies
        run: python -m pip install "mcp==2.0.0" "mcp-video[image,ai-scene]==1.2.1" boto3 pytest fastapi httpx
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            api/chat.py api/main.py api/uploads.py \
            core/main.py core/mcp_tools.py core/registre_outils.py \
            core/serveur_mcp_video.py core/video_workspaces.py \
            core/stockage_r2.py tests/test_video_workspaces.py
      - name: Test workspace isolation and persistence
        run: python -m pytest -q tests/test_video_workspaces.py
      - name: Smoke-test upstream MCP tool discovery
        run: |
          python - <<'PY'
          from core.serveur_mcp_video import _termes_recherche_video, _tools_dict, _schema
          tools = _tools_dict()
          assert len(tools) >= 50, f"Too few mcp-video tools discovered: {len(tools)}"
          assert "video_trim" in tools, "video_trim was not registered"
          assert "remotion_render" in tools, "Remotion render tool was not registered"
          assert callable(getattr(tools["video_trim"], "fn", None)), "video_trim handler is not callable"
          assert isinstance(_schema(tools["video_trim"]), dict), "video_trim schema is unavailable"
          assert "trim" in _termes_recherche_video("couper ce passage"), "French edit request did not map to trim"
          assert "subtitle" in _termes_recherche_video("ajouter un sous-titre"), "French subtitle request was not mapped"
          assert "text" in _termes_recherche_video("ajouter un titre"), "French title request was not mapped"
          print(f"Discovered {len(tools)} mcp-video tools; schemas and French discovery terms are available.")
          PY
      - name: Verify the mounted MCP HTTP interface end to end
        run: |
          python - <<'PY'
          import asyncio
          import os
          import tempfile
          from pathlib import Path

          os.environ["SUPABASE_SECRET"] = "test-only-video-mcp-secret"

          import httpx
          from fastapi import FastAPI
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client
          from core.serveur_mcp_video import mcp_video
          import core.video_workspaces as video_workspaces

          async def verifier():
              with tempfile.TemporaryDirectory(prefix="classinus-video-mcp-http-") as temporary:
                  video_workspaces.ROOT = Path(temporary) / "workspace"
                  app = FastAPI()
                  app.mount(
                      "/mcp/video",
                      mcp_video.streamable_http_app(stateless_http=True, streamable_http_path="/"),
                  )
                  url = "http://testserver/mcp/video?user_id=ci-user&conversation_id=ci-conversation"
                  async with mcp_video.session_manager.run():
                      async with httpx.AsyncClient(
                          transport=httpx.ASGITransport(app=app),
                          base_url="http://testserver",
                          headers={"Authorization": "Bearer test-only-video-mcp-secret"},
                      ) as client:
                          async with streamable_http_client(url, http_client=client) as (read, write):
                              async with ClientSession(read, write) as session:
                                  await session.initialize()
                                  outils = (await session.list_tools()).tools
                                  noms = {outil.name for outil in outils}
                                  assert "video_lister_outils" in noms, f"Missing discovery tool: {sorted(noms)}"
                                  assert "video_executer_outil" in noms, f"Missing execution tool: {sorted(noms)}"
                                  resultat = await session.call_tool(
                                      "video_lister_outils",
                                      arguments={"recherche": "couper ce passage"},
                                  )
                                  assert not resultat.isError, f"MCP call returned an error: {resultat}"
                                  texte = "\\n".join(
                                      bloc.text for bloc in resultat.content if hasattr(bloc, "text")
                                  )
                                  assert "video_trim" in texte, f"French tool lookup missed video_trim: {texte}"
                                  print(f"MCP HTTP protocol passed: {len(outils)} wrapper tools exposed and video_trim discovered.")
          asyncio.run(verifier())
          PY
      - name: Execute a real FFmpeg trim in an isolated workspace
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          import tempfile
          from pathlib import Path

          from core.serveur_mcp_video import _normaliser_arguments, _tools_dict

          with tempfile.TemporaryDirectory(prefix="classinus-video-smoke-") as temporary:
              root = Path(temporary).resolve()
              (root / "uploads").mkdir()
              (root / "outputs").mkdir()
              source = root / "uploads" / "source.mp4"

              # Le paramètre "inputs" de l'outil batch contient une liste de
              # chemins : aucun élément ne doit pouvoir sortir du workspace.
              try:
                  _normaliser_arguments(
                      "video_batch",
                      {"inputs": ["../../etc/passwd"], "operation": "trim"},
                      root,
                  )
              except ValueError:
                  pass
              else:
                  raise AssertionError("video_batch accepted a path outside the workspace")

              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-f", "lavfi", "-i", "color=c=blue:s=320x240:d=2:r=24",
                  "-an", "-c:v", "libx264", "-pix_fmt", "yuv420p", str(source),
              ], check=True, timeout=30)
              source_digest = hashlib.sha256(source.read_bytes()).hexdigest()
              outil = _tools_dict()["video_trim"]
              arguments = _normaliser_arguments(
                  "video_trim",
                  {"input_path": "uploads/source.mp4", "start": "0", "duration": "1"},
                  root,
              )
              assert str(root / "outputs") in arguments["output_path"], "Output path escaped outputs/"
              resultat = outil.fn(**arguments)
              assert isinstance(resultat, dict) and resultat.get("success") is True, f"Trim failed: {resultat}"
              sortie = Path(arguments["output_path"])
              assert sortie.is_file() and sortie.stat().st_size > 0, "Trim produced no output file"
              assert hashlib.sha256(source.read_bytes()).hexdigest() == source_digest, "Source video was overwritten"
              print(f"FFmpeg trim passed: {source.stat().st_size} source bytes -> {sortie.stat().st_size} output bytes.")
          PY
