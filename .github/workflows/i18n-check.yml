name: Internationalization checks

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-localization:
    name: Backend localization tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check fastapi
      - name: Compile all backend API and core modules
        run: python -m compileall -q api core
      - name: Test API localization
        run: python -m unittest -v test_i18n
