name: Internationalization checks

on:
  push:
    branches:
      - feature/i18n-fr-en
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-localization:
    name: Backend localization tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check fastapi
      - name: Check syntax of changed backend modules
        run: >-
          python -m py_compile
          api/auth.py api/chat.py
          core/limitation_debit.py
          core/file_attente_vectorisation.py
          core/vectorisation_dossiers_designes.py
          core/file_attente_description_skills.py
          core/taches_file_attente.py
      - name: Test API localization
        run: python -m unittest -v test_i18n
